name: CI/CD Pipeline for DocTender

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # ===== QUALITY CHECKS =====
  quality-checks:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Black code formatting check
      run: black --check api/ tests/
      continue-on-error: true
    
    - name: iSort imports check
      run: isort --check-only api/ tests/
      continue-on-error: true
    
    - name: Flake8 linting
      run: flake8 api/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Pylint analysis
      run: pylint api/ --exit-zero --output-format=colorized
      continue-on-error: true
    
    - name: MyPy type checking
      run: mypy api/ --ignore-missing-imports
      continue-on-error: true

  # ===== UNIT TESTS & COVERAGE =====
  tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install fastapi uvicorn
    
    - name: Run tests with pytest
      run: |
        pytest tests/test_api_comprehensive.py \
          -v \
          --tb=short \
          --cov=api \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results.xml
    
    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80
      continue-on-error: true
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results.xml
    
    - name: Upload coverage HTML report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  # ===== SECURITY SCANNING =====
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Bandit security check
      run: bandit -r api/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Safety check for vulnerable dependencies
      run: safety check --json
      continue-on-error: true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: bandit-report.json

  # ===== DOCKER BUILD & TEST =====
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t doctender:test .
    
    - name: Test Docker image
      run: |
        # Start container in background
        docker run -d -p 8000:8000 --name doctender-test doctender:test
        
        # Wait for service to start
        sleep 5
        
        # Test health endpoint
        docker run --network host curlimages/curl:latest \
          curl -f http://localhost:8000/health || exit 1
        
        # Stop container
        docker stop doctender-test
      continue-on-error: true

  # ===== API INTEGRATION TESTS =====
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install fastapi uvicorn pytest pytest-asyncio httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doctender_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/test_api_comprehensive.py -v -m integration --tb=short
      continue-on-error: true

  # ===== BUILD ARTIFACTS =====
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install build tools
      run: |
        pip install --upgrade pip build wheel
    
    - name: Build distributions
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package-distributions
        path: dist/

  # ===== PUBLISH RESULTS =====
  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v3
      with:
        path: all-test-results
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: all-test-results/**/test-results.xml
        check_name: Unit Test Results

  # ===== NOTIFY ON FAILURE =====
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [quality-checks, tests, security, docker]
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'CI/CD Pipeline Failed for DocTender'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: secrets.SLACK_WEBHOOK != ''
      continue-on-error: true
    
    - name: Create issue for failed build
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `CI/CD Pipeline Failed on ${context.ref}`,
            body: `Build failed: ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          })
      if: failure()
      continue-on-error: true
